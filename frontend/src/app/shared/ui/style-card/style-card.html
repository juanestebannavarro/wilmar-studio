<article class="card">
  <div class="card__photo">
    <span>Foto pendiente</span>
    <button
      type="button"
      class="heart"
      [class.heart--on]="favorito()"
      [attr.aria-pressed]="favorito()"
      [attr.aria-label]="
        (favorito() ? 'Quitar de tu WiliList: ' : 'Guardar en tu WiliList: ') + estilo().nombre
      "
      (click)="wili.alternar(estilo().id)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.7 4.5 6.4 4.5c2 0 3.7 1.1 5.6 3.2 1.9-2.1 3.6-3.2 5.6-3.2 3.7 0 5.5 3.8 4 7.2C19.5 16.4 12 21 12 21z"
        />
      </svg>
    </button>
  </div>
  <div class="card__body">
    <p class="card__cat">{{ estilo().categoria }}</p>
    <h3 class="card__name">{{ estilo().nombre }}</h3>
    <p class="card__text">{{ estilo().frase }}</p>
    <a routerLink="/turno" class="btn btn--ghost card__btn">Quiero este estilo</a>
  </div>
</article>
